<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f3" />
    <title>Polytope</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Polytope 首页">
        <img class="brand-logo" src="./assets/polytope-logo.png" alt="" />
        <span>Polytope</span>
      </a>

      <nav class="main-nav" aria-label="主导航">
        <button class="nav-link active" data-view="timeline" aria-label="Timeline">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M6 7h5M6 12h9M6 17h12"></path></svg>
          <span>Timeline</span>
        </button>
        <button class="nav-link" data-view="elements" aria-label="Element">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="2.5"></circle><circle cx="17" cy="7" r="2.5"></circle><circle cx="7" cy="17" r="2.5"></circle><circle cx="17" cy="17" r="2.5"></circle></svg>
          <span>Element</span>
        </button>
      </nav>

      <div class="header-actions">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input id="searchInput" type="search" placeholder="搜索梦境、地点或元素" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
        <button class="add-button" id="openComposer">
          <span>＋</span> 记录新梦
        </button>
      </div>
    </header>

    <div class="display-switch" role="group" aria-label="展示模式">
      <button class="active" data-display="desktop" title="桌面模式" aria-label="桌面模式">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"></rect><path d="M8 21h8M12 17v4"></path></svg>
      </button>
      <button data-display="mobile" title="手机模式" aria-label="手机模式">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M10 5h4M11 19h2"></path></svg>
      </button>
    </div>

    <main>
      <section id="timelineView" class="view active" aria-label="梦境时间线">
        <div class="year-bar">
          <div class="year-filters" id="yearFilters"></div>
          <button class="sort-button" id="sortButton">最新优先 ↓</button>
        </div>
        <div class="dream-timeline" id="dreamGrid"></div>
      </section>

      <section id="elementsView" class="view" aria-label="梦境元素">
        <section class="filter-rail" aria-label="快速筛选">
          <button class="rail-arrow" id="railPrev" aria-label="向左滚动">←</button>
          <div class="rail-list" id="railList"></div>
          <button class="rail-arrow" id="railNext" aria-label="向右滚动">→</button>
        </section>
        <div class="element-layout">
          <aside class="element-index">
            <div class="section-label">元素索引</div>
            <div class="tag-cloud" id="tagCloud"></div>
          </aside>
          <div class="element-results">
            <div class="element-heading">
              <span id="activeElementTitle">全部梦境</span>
              <button id="clearElement">清除筛选</button>
            </div>
            <div class="dream-grid compact" id="elementGrid"></div>
          </div>
        </div>
      </section>

      <section class="empty-state" id="emptyState" hidden>
        <span>✦</span>
        <h2>没有找到这段梦</h2>
        <p>换一个关键词，或记录一场新的梦。</p>
      </section>
    </main>

    <dialog class="composer" id="composer">
      <form method="dialog" id="dreamForm">
        <div class="dialog-topline">
          <div>
            <p class="eyebrow">NEW DREAM ENTRY</p>
            <h2>记录新梦</h2>
          </div>
          <button type="button" class="icon-button" id="closeComposer" aria-label="关闭">×</button>
        </div>

        <label>梦境标题 <small>可选</small><input name="title" maxlength="40" placeholder="给这个梦取一个名字" /></label>
        <div class="form-row">
          <label>梦见日期<input name="date" type="date" required /></label>
          <label>情绪
            <select name="mood">
              <option value="">不选择</option><option>平静</option><option>奇异</option><option>愉悦</option><option>怀念</option><option>不安</option><option>恐惧</option>
            </select>
          </label>
        </div>
        <label>梦境内容<textarea name="content" required rows="6" placeholder="从你还记得的那一幕开始……"></textarea></label>
        <fieldset class="color-fieldset">
          <legend>颜色感受 <small>可多选</small></legend>
          <div class="color-palette" id="colorPalette">
            <label style="--swatch:#111111"><input type="checkbox" name="colors" value="#111111" /><span title="墨黑"></span></label>
            <label style="--swatch:#7f7f7f"><input type="checkbox" name="colors" value="#7f7f7f" /><span title="雾灰"></span></label>
            <label style="--swatch:#f2f0e8"><input type="checkbox" name="colors" value="#f2f0e8" /><span title="月白"></span></label>
            <label style="--swatch:#315a89"><input type="checkbox" name="colors" value="#315a89" /><span title="深蓝"></span></label>
            <label style="--swatch:#789da8"><input type="checkbox" name="colors" value="#789da8" /><span title="雾蓝"></span></label>
            <label style="--swatch:#55735b"><input type="checkbox" name="colors" value="#55735b" /><span title="苔绿"></span></label>
            <label style="--swatch:#b9a36a"><input type="checkbox" name="colors" value="#b9a36a" /><span title="昏黄"></span></label>
            <label style="--swatch:#9b6548"><input type="checkbox" name="colors" value="#9b6548" /><span title="赭石"></span></label>
            <label style="--swatch:#894e55"><input type="checkbox" name="colors" value="#894e55" /><span title="暗红"></span></label>
            <label style="--swatch:#71617f"><input type="checkbox" name="colors" value="#71617f" /><span title="暮紫"></span></label>
            <label class="custom-color"><input id="customColor" type="color" value="#373737" /><span title="自定义颜色">＋</span></label>
          </div>
        </fieldset>
        <label>元素标签 <small>可选</small><input name="tags" placeholder="用逗号分隔，如：海、旧友、飞行" /></label>
        <label>醒来后的一句话 <small>可选</small><input name="afterthought" maxlength="80" placeholder="可选" /></label>

        <div class="dialog-actions">
          <button type="button" class="text-button" id="cancelComposer">取消</button>
          <button type="submit" class="save-button">保存到档案</button>
        </div>
      </form>
    </dialog>

    <dialog class="detail-dialog" id="detailDialog">
      <button class="icon-button detail-close" id="closeDetail" aria-label="关闭">×</button>
      <div id="detailContent"></div>
    </dialog>

    <template id="dreamCardTemplate">
      <article class="dream-card">
        <button class="card-open" aria-label="查看梦境详情">
          <div class="card-body">
            <div class="card-meta"><time></time><span class="mood"></span></div>
            <h2></h2>
            <p class="card-excerpt"></p>
            <div class="card-tags"></div>
          </div>
        </button>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
